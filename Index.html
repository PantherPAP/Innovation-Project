</html><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia Article of the Day</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 90%;
        }
        .date {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        h1 {
            font-size: 2rem;
            margin: 0 0 15px 0;
            color: #111;
        }
        .thumbnail {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none; /* Hidden by default, shown if image exists */
        }
        p {
            line-height: 1.6;
            color: #444;
            font-size: 1.1rem;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #36b;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #248;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="date" id="current-date">Loading date...</div>
        <h1 id="article-title">Fetching today's article...</h1>
        <img id="article-img" class="thumbnail" src="" alt="Article image">
        <p id="article-extract">Please wait while we grab the latest summary from Wikipedia.</p>
        <a id="article-link" class="btn" href="#" target="_blank" style="display: none;">Read Full Article</a>
    </div>

    <script>
        async function fetchDailyArticle() {
            try {
                // 1. Get today's date formatted as YYYY/MM/DD
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
               
                // Display the readable date on the UI
                document.getElementById('current-date').innerText = today.toLocaleDateString('en-US', {
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                });

                // 2. Query Wikipedia's REST API for today's featured content
                const apiUrl = `https://en.wikipedia.org/api/rest_v1/feed/featured/${year}/${month}/${day}`;
                const response = await fetch(apiUrl);
               
                if (!response.ok) throw new Error("Failed to fetch data from Wikipedia.");
                const data = await response.json();

                // 3. Extract the "tfa" (Today's Featured Article) object
                const article = data.tfa;

                // 4. Update the DOM elements with Wikipedia's data
                document.getElementById('article-title').innerText = article.title;
                document.getElementById('article-extract').innerText = article.extract;
               
                const linkElement = document.getElementById('article-link');
                linkElement.href = article.content_urls.desktop.page;
                linkElement.style.display = 'inline-block';

                // 5. Handle image if available
                if (article.thumbnail) {
                    const imgElement = document.getElementById('article-img');
                    imgElement.src = article.thumbnail.source;
                    imgElement.style.display = 'block';
                }

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('article-title').innerText = "Oops!";
                document.getElementById('article-extract').innerText = "Could not load today's article. Please try again later.";
            }
        }

        // Run the function when the page loads
        fetchDailyArticle();
    </script>
</body>
</html>
